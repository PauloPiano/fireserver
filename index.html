<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireserver</title>
<style>
:root{--bg:#0f1218;--card:#181d26;--text:#f2f4f8;--muted:#9aa3b2;--accent:#ff6a00;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--text:#161a21;--muted:#5d6675;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:2rem 1rem;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{text-align:center}
h1{margin:.5rem 0 .25rem;font-size:2.4rem;letter-spacing:.02em}
h1 span{color:var(--accent)}
p{margin:0;color:var(--muted)}
nav{display:grid;gap:1rem;width:min(420px,100%)}
.btn{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;padding:1.1rem 1.25rem;border-radius:14px;background:var(--card);color:var(--text);font-weight:600;border:2px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:border-color .15s,transform .15s}
.btn:hover,.btn:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
</style>
</head>
<body>
<header>

<h1>Fire<span>server</span></h1>
<p>Choose your server</p>
</header>
<nav>
<!-- Keep tiles in alphabetical order -->
<button type="button" class="btn" data-url="http://80.0.25.124:8099/web/index.html#!/home">Fireserver</button>
<button type="button" class="btn" data-url="http://80.0.25.124:8098/web/index.html#!/home">HPz Fireserver</button>
<button type="button" class="btn" data-url="http://80.0.25.124:8096">Myserver</button>
</nav>
<script>
document.querySelectorAll('.btn[data-url]').forEach(function (b) {
  b.addEventListener('click', function () { location.href = b.dataset.url; });
});
</script>
</body>
</html>
