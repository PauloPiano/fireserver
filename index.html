<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireserver</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #0b1f3f;
  --surface: #12294f;
  --text: #eaf1ff;
  --muted: #a6b9dc;
  --line: #25407a;
  --ember: #f97316;
  --ember-strong: #fb923c;
  --on-ember: #0b1f3f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b1f3f;
    --surface: #12294f;
    --text: #eaf1ff;
    --muted: #a6b9dc;
    --line: #25407a;
    --ember: #f97316;
    --ember-strong: #fb923c;
    --on-ember: #1a1210;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1f3f;
  --surface: #12294f;
  --text: #eaf1ff;
  --muted: #a6b9dc;
  --line: #25407a;
  --ember: #f97316;
  --ember-strong: #fb923c;
  --on-ember: #1a1210;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.25rem;
}
main { width: 100%; max-width: 34rem; }
h1 {
  font-size: clamp(2.75rem, 12vw, 4.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  margin: 0 0 0.75rem;
}
.lede { color: var(--muted); margin: 0 0 2rem; font-size: 1.05rem; }
.links { display: grid; gap: 1rem; }
.link {
  display: block;
  text-decoration: none;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--ember);
  border-radius: 6px;
  padding: 1.25rem 1.5rem;
  transition: background 0.15s, border-color 0.15s;
}
.link:hover { border-left-color: var(--ember-strong); background: var(--bg); }
.link:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }
.link strong { display: block; font-size: 1.35rem; letter-spacing: -0.01em; }
.link span { display: block; margin-top: 0.25rem; color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Fireserver</h1>
  <p class="lede">Choose a server to open.</p>
  <nav class="links" aria-label="Servers">
    <a class="link" href="http://80.0.25.124:8099/web/index.html#!/home">
      <strong>Fireserver</strong>
    </a>
    <a class="link" href="http://80.0.25.124:8098/web/index.html#!/home">
      <strong>HPz Fireserver</strong>
    </a>
  </nav>
</main>
</body>
</html>
